# Override: make left half the peripheral
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# BLE split link: more transmit buffers on the peripheral. ZMK relays each
# input event with a direct bt_gatt_notify() from the input thread, and
# Zephyr allocates that buffer with an unbounded wait. With the stock 3
# buffers, a 4-event pad frame (X, Y, split stamp, Z) blocked the input
# thread on the 4th until the next connection event, so the NEXT frame's
# stamp was taken late (measured 2026-09-21, fully wireless: stamp delay
# p90 4.6 ms / max 15 ms, ~10% of frames; wired split unaffected). 8 keeps
# a 10 ms frame's 4 notifications from ever exhausting the pool at the
# split's 7.5 ms connection interval. RAM cost: a few hundred bytes.
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_CONN_TX_MAX=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
