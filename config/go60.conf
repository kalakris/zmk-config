# Sleep after one hour (1*60*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y

# Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Full consumer HID report (needed for GLOBE key)
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

# Mouse / trackpad
CONFIG_ZMK_POINTING=y

# RGB
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# Per-key/per-layer RGB underglow (darknao/zmk PR36).
# Effect 4 is layer-indicators, but the EFF_START Kconfig range is
# hardcoded [0,3], so it can't be the boot default. Cycle to it once
# via RGB_EFF on first activation; CONFIG_SETTINGS persists the choice.
CONFIG_EXPERIMENTAL_RGB_LAYER=y

# Debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8
