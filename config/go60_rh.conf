# Override: make right half the central (main) device
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Enable USB (right half defconfig has CONFIG_ZMK_USB=n, but central needs it)
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_BOOT=y

# Raw touch streaming (protocol v2): stream absolute touch frames from the
# right pad over a vendor HID report. Scroll mode is flagged whenever the
# nav_scroll listener overlay (go60_rh.keymap) would handle the pad's events
# — it carries the &zip_touch_stream_scroll marker processor. See
# docs/raw-touch-protocol.md. Pairs with abs-mode on &glidepoint in
# go60_rh.keymap.
CONFIG_ZMK_TOUCH_STREAM=y
