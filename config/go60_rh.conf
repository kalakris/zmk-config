# Override: make right half the central (main) device
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Enable USB (right half defconfig has CONFIG_ZMK_USB=n, but central needs it)
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_BOOT=y

# Raw touch streaming (protocol v2): stream absolute touch frames from the
# right pad over a vendor HID report. Provided by the out-of-tree module
# vendored at vendor/zmk-raw-touch (see config/west.yml), which carries its own HID
# report descriptor on its own USB HID interface and its own BLE HIDS
# instance - no patch to ZMK core.
#
# Enabled automatically by the raw_touch_rh devicetree node in
# go60_rh.keymap; set explicitly here for legibility.
CONFIG_ZMK_RAW_TOUCH=y

# MANDATORY, and it fails at RUNTIME rather than at build time if missing:
# the module claims the second USB HID interface ("HID_1"), ZMK core owns
# "HID_0". Without this, device_get_binding("HID_1") returns NULL, the
# keyboard still works, and the raw stream silently does not exist.
CONFIG_USB_HID_DEVICE_COUNT=2

# Wired-split poll cadence (central-only knobs; defaults 20 and 15).
# The half-duplex wired transport is polled: the central sends POLL_EVENTS
# and the peripheral answers with its whole event queue in one burst. The
# stock 20 ms post-response quiet period makes the loaded cycle ~22.5 ms,
# so the LH pad's ~10 ms touch frames pile up 2-3 per poll (measured
# 2026-08-28; see docs/raw-touch.md "Split-link timing"). 3/5 targets a
# ~5 ms cycle: <=1 frame per poll, and less LH key latency as a bonus.
# A full poll exchange costs ~1 ms at 921600 baud, so the margin is sane.
CONFIG_ZMK_SPLIT_WIRED_HALF_DUPLEX_RX_COMPLETE_TIMEOUT=3
CONFIG_ZMK_SPLIT_WIRED_HALF_DUPLEX_RX_TIMEOUT=5
