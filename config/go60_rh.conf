# Override: make right half the central (main) device
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Enable USB (right half defconfig has CONFIG_ZMK_USB=n, but central needs it)
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_BOOT=y

# Raw touch streaming (prototype): stream absolute touch frames from the
# right pad over a vendor HID report; scroll mode flagged while Nav (layer 2)
# is active. See docs/raw-touch-protocol.md. Pairs with abs-mode on
# &glidepoint in go60_rh.keymap.
CONFIG_ZMK_TOUCH_STREAM=y
CONFIG_ZMK_TOUCH_STREAM_SCROLL_LAYER=2
