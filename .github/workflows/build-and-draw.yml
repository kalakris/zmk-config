name: Build and Draw
on:
  workflow_dispatch:
  push:

jobs:
  build:
    permissions:
      contents: read
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/eyelash_sofle.keymap config/go60.keymap"
      # The Go60 board lives in the ZMK fork, which this workflow does not fetch,
      # so point the drawer at the vendored copy of its physical layout.
      draw_args: "go60:'-d config/go60-layouts.dtsi'"
      commit_message: "[Draw] ${{ github.event.head_commit.message }}"
      destination: "commit"
      fail_on_error: true
