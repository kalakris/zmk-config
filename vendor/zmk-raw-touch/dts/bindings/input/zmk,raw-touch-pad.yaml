description: |
  A trackpad whose absolute touch frames are streamed to the host over the
  raw touch vendor HID report.

  The referenced input device must emit INPUT_ABS_X, INPUT_ABS_Y and
  INPUT_ABS_Z (the last carrying the sync flag) - i.e. it must be running
  in absolute mode. The module is otherwise driver-agnostic: nothing here
  is specific to any particular touchpad ASIC.

  Geometry and orientation are declared here rather than read from the
  driver's own devicetree properties, both so the module does not depend
  on a specific driver binding and so the values can be published verbatim
  in the self-describing feature report.

compatible: "zmk,raw-touch-pad"

properties:
  device:
    type: phandle
    required: true
    description: The input device producing absolute touch events.

  pad-id:
    type: int
    default: 0
    description: |
      Identifies this pad in streamed frames (byte 0) and sets the pad's
      bit in the feature report's pads-present bitmask. Must be unique and
      less than 8.

  x-max:
    type: int
    default: 2047
    description: |
      Maximum absolute X coordinate the pad reports. The default is the
      Cirque Pinnacle full-scale value.

  y-max:
    type: int
    default: 1535
    description: |
      Maximum absolute Y coordinate the pad reports. The default is the
      Cirque Pinnacle full-scale value.

  resolution:
    type: int
    default: 38
    description: |
      Pad resolution in counts per millimetre, 0 if unknown. The default is
      the Cirque Pinnacle value.

  rotate-90:
    type: boolean
    description: |
      The pad is physically mounted rotated 90 degrees. Streamed frames are
      NOT transformed - the raw coordinates go out as-is and this flag is
      published in the feature report's orientation byte so the host can
      apply it. It IS applied to the relative deltas this module derives
      for the Standard-mode pointer path.

  x-invert:
    type: boolean
    description: As rotate-90, for the X axis.

  y-invert:
    type: boolean
    description: As rotate-90, for the Y axis.

  tap-click:
    type: boolean
    description: |
      Detect taps in firmware and inject an INPUT_BTN_0 press+release into
      this pad's input listener chain. Absolute mode usually disables a
      pad's hardware tap-to-click, so this is its replacement.

      The pad's listener chain must NOT contain a processor that consumes
      INPUT_BTN_0 (e.g. zmk,input-processor-behaviors mapping it to &none),
      or the injected click is swallowed.

  tap-click-while-scrolling:
    type: boolean
    description: |
      Also report taps for touches that were handled by a processor chain
      marked with zmk,input-processor-raw-touch-scroll. Without this, a
      touch that entered scroll context never produces a tap, which keeps
      a flick on a scroll layer from clicking. Set it on a dedicated
      scrolling pad whose taps should still click - for example, mapped to
      a right click by the listener chain, as MoErgo's stock Go60 keymap
      does with its left pad. Requires tap-click.

      In Standard mode the tap is emitted at lift-off as usual. While a
      host holds the lease, the firmware cannot tell such a tap from a
      short touch that merely stopped the host's momentum, so it parks the
      tap for a moment and emits it only when the host confirms it (a
      feature-report command; RawTouch does this automatically for touches
      that did not catch a coast). The listener chain decides what the tap
      does in both cases. The pad advertises this in its feature-report
      slot so a host knows to confirm.

  tap-max-ms:
    type: int
    default: 180
    description: Maximum touch duration still counted as a tap.

  tap-max-movement:
    type: int
    default: 30
    description: |
      Maximum Chebyshev distance in raw counts a touch may stray from its
      touch-down point and still count as a tap.

