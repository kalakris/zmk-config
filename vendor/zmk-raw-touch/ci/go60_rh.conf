# Right half = central, as on the verified keyboard (the board defaults the
# left half to central). The central talks to the host, so it needs USB,
# which the right half's defconfig leaves off.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_USB=y

# Enabled automatically by the raw-touch pad nodes in go60_rh.keymap; set
# explicitly so the build fails loudly if the nodes ever go missing.
CONFIG_ZMK_RAW_TOUCH=y

# The module takes the second USB HID interface (HID_1); ZMK core owns
# HID_0. The module defaults this to 2 - an explicit lower value fails the
# build.
CONFIG_USB_HID_DEVICE_COUNT=2

# Wired-split poll cadence (see the README's "Wired split timing").
CONFIG_ZMK_SPLIT_WIRED_HALF_DUPLEX_RX_COMPLETE_TIMEOUT=3
CONFIG_ZMK_SPLIT_WIRED_HALF_DUPLEX_RX_TIMEOUT=5
