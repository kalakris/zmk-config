# Shared by both halves of the CI build (ZMK also reads go60_lh.conf and
# go60_rh.conf, per half).

# Required by the module; the Go60 board defaults it on, set here for the
# README's step 4.
CONFIG_ZMK_POINTING=y

# Headroom for two absolute-mode pads streaming ~100 Hz through long
# processor chains: the stock 16-deep input queue drops K_NO_WAIT-injected
# events when full, and the stock 512-byte input thread stack is thin for
# the chain depth (see the README's "Wired split timing").
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_INPUT_THREAD_STACK_SIZE=2048
