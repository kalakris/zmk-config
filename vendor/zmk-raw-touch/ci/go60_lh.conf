# Left half = peripheral (the board defaults it to central).
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Over a BLE split link, ZMK relays each input event with its own GATT
# notification from the input thread. A stamped pad frame is four events
# (X, Y, stamp, Z); with the stock 3 transmit buffers the fourth blocks the
# input thread until the next connection event and the next frame's stamp
# is taken late. 8 keeps a 10 ms frame from exhausting the pool. Harmless
# on a wired split.
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_CONN_TX_MAX=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
